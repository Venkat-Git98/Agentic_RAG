name: Neo4j keep-alive

# Aura Free pauses a database after 3 days without a write and deletes it 30
# days later. This writes a heartbeat every day, whether or not the backend is up.
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  actions: write   # lets the last step keep this schedule enabled
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Backend/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "neo4j>=5.20,<6"
      - name: Write heartbeat
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: python Backend/scripts/neo4j_keepalive.py
      # GitHub switches scheduled workflows off after 60 days without a commit.
      # Re-enabling the workflow resets that timer, so the schedule never lapses.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/neo4j-keepalive.yml/enable"
